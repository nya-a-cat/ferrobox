name: Firecracker KVM E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            debootstrap \
            btrfs-progs \
            e2fsprogs \
            jq \
            musl-tools \
            protobuf-compiler \
            zstd

      - name: Require nested KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Build node and static guest
        run: |
          cargo generate-lockfile
          cargo build -p ferrobox-node --locked
          cargo build -p ferrobox-api --locked
          cargo build -p ferrobox-guest \
            --release \
            --target x86_64-unknown-linux-musl \
            --locked

      - name: Fetch verified Firecracker
        run: |
          bash scripts/fetch-firecracker.sh "${RUNNER_TEMP}/firecracker"
          sudo install -d -o root -g root -m 0755 /opt/ferrobox/bin
          sudo install -o root -g root -m 0755 \
            "${RUNNER_TEMP}/firecracker/firecracker" \
            /opt/ferrobox/bin/firecracker
          sudo install -o root -g root -m 0755 \
            "${RUNNER_TEMP}/firecracker/jailer" \
            /opt/ferrobox/bin/jailer

      - name: Fetch Firecracker CI kernel
        shell: bash
        run: |
          set -euo pipefail
          kernel_key='firecracker-ci/v1.15/x86_64/vmlinux-6.1.155'
          expected_kernel_sha256='e20e46d0c36c55c0d1014eb20576171b3f3d922260d9f792017aeff53af3d4f2'
          kernel="${RUNNER_TEMP}/vmlinux"
          curl --fail --location --silent --show-error \
            --output "${kernel}" \
            "https://s3.amazonaws.com/spec.ccfc.min/${kernel_key}"
          kernel_sha256="$(sha256sum "${kernel}" | awk '{print $1}')"
          [[ "${kernel_sha256}" == "${expected_kernel_sha256}" ]]
          {
            printf 'kernel_key=%s\n' "${kernel_key}"
            printf 'kernel_sha256=%s\n' "${kernel_sha256}"
          } | tee "${RUNNER_TEMP}/kernel.manifest"
          sudo install -d -o root -g root -m 0755 /opt/ferrobox/images
          sudo install -o root -g root -m 0444 \
            "${kernel}" \
            /opt/ferrobox/images/vmlinux

      - name: Build Python guest rootfs
        run: |
          sudo bash scripts/build-python-rootfs.sh \
            target/x86_64-unknown-linux-musl/release/ferrobox-guest \
            /opt/ferrobox/images/python.ext4
          sudo chmod 0444 /opt/ferrobox/images/python.ext4

      - name: Prepare copy-on-write runtime storage
        run: |
          sudo truncate -s 8G "${RUNNER_TEMP}/ferrobox.btrfs"
          sudo mkfs.btrfs --force --quiet "${RUNNER_TEMP}/ferrobox.btrfs"
          sudo install -d -o root -g root -m 0755 /mnt/ferrobox
          sudo mount -o loop "${RUNNER_TEMP}/ferrobox.btrfs" /mnt/ferrobox
          sudo install -d -o root -g root -m 0755 \
            /mnt/ferrobox/images \
            /mnt/ferrobox/jailer \
            /mnt/ferrobox/runtime \
            /mnt/ferrobox/snapshots \
            /srv/ferrobox/jailer \
            /var/lib/ferrobox/runtime
          sudo cp --sparse=always /opt/ferrobox/images/vmlinux \
            /mnt/ferrobox/images/vmlinux
          sudo cp --sparse=always /opt/ferrobox/images/python.ext4 \
            /mnt/ferrobox/images/python.ext4
          sudo chmod 0444 \
            /mnt/ferrobox/images/vmlinux \
            /mnt/ferrobox/images/python.ext4
          sudo cp --reflink=always \
            /mnt/ferrobox/images/python.ext4 \
            /mnt/ferrobox/images/reflink-check.ext4
          sudo rm /mnt/ferrobox/images/reflink-check.ext4
          sudo sysctl -w net.ipv4.ip_forward=1
          if [[ -w /sys/fs/cgroup/cgroup.subtree_control ]]; then
            echo '+cpu +memory +pids' |
              sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null || true
          fi

      - name: Run Firecracker end-to-end
        env:
          FERROBOX_FIRECRACKER: /opt/ferrobox/bin/firecracker
          FERROBOX_JAILER: /opt/ferrobox/bin/jailer
          FERROBOX_KERNEL: /mnt/ferrobox/images/vmlinux
          FERROBOX_ROOTFS: /mnt/ferrobox/images/python.ext4
          FERROBOX_SNAPSHOT_ROOT: /mnt/ferrobox/snapshots/python
          FERROBOX_CHROOT_BASE: /mnt/ferrobox/jailer
          FERROBOX_RUNTIME_ROOT: /mnt/ferrobox/runtime
          FERROBOX_NODE_BINARY: target/debug/ferrobox-node
        run: sudo --preserve-env=FERROBOX_FIRECRACKER,FERROBOX_JAILER,FERROBOX_KERNEL,FERROBOX_ROOTFS,FERROBOX_SNAPSHOT_ROOT,FERROBOX_CHROOT_BASE,FERROBOX_RUNTIME_ROOT,FERROBOX_NODE_BINARY bash scripts/e2e-kvm.sh

      - name: Benchmark Firecracker runtime
        env:
          FERROBOX_FIRECRACKER: /opt/ferrobox/bin/firecracker
          FERROBOX_JAILER: /opt/ferrobox/bin/jailer
          FERROBOX_KERNEL: /mnt/ferrobox/images/vmlinux
          FERROBOX_ROOTFS: /mnt/ferrobox/images/python.ext4
          FERROBOX_SNAPSHOT_ROOT: /mnt/ferrobox/snapshots/python
          FERROBOX_CHROOT_BASE: /mnt/ferrobox/jailer
          FERROBOX_RUNTIME_ROOT: /mnt/ferrobox/runtime
          FERROBOX_NODE_BINARY: target/debug/ferrobox-node
          FERROBOX_BENCHMARK_OUTPUT: ${{ runner.temp }}/ferrobox-benchmark.json
          FERROBOX_BENCHMARK_CREATE_ITERATIONS: "5"
          FERROBOX_BENCHMARK_ITERATIONS: "100"
          FERROBOX_BENCHMARK_PYTHON_ITERATIONS: "30"
          FERROBOX_BENCHMARK_FILE_ITERATIONS: "20"
        run: sudo --preserve-env=FERROBOX_FIRECRACKER,FERROBOX_JAILER,FERROBOX_KERNEL,FERROBOX_ROOTFS,FERROBOX_SNAPSHOT_ROOT,FERROBOX_CHROOT_BASE,FERROBOX_RUNTIME_ROOT,FERROBOX_NODE_BINARY,FERROBOX_BENCHMARK_OUTPUT,FERROBOX_BENCHMARK_CREATE_ITERATIONS,FERROBOX_BENCHMARK_ITERATIONS,FERROBOX_BENCHMARK_PYTHON_ITERATIONS,FERROBOX_BENCHMARK_FILE_ITERATIONS bash scripts/benchmark-kvm.sh

      - name: Benchmark HTTP ready-pool allocation
        env:
          FERROBOX_HTTP_BENCHMARK_OUTPUT: ${{ runner.temp }}/ferrobox-http-benchmark.json
          FERROBOX_API_LOG: ${{ runner.temp }}/ferrobox-api.log
        run: |
          set -euo pipefail
          sudo target/debug/ferrobox-api \
            --backend firecracker \
            --listen 127.0.0.1:18080 \
            --audit-log /mnt/ferrobox/runtime/http-audit.jsonl \
            --firecracker /opt/ferrobox/bin/firecracker \
            --jailer /opt/ferrobox/bin/jailer \
            --kernel /mnt/ferrobox/images/vmlinux \
            --rootfs /mnt/ferrobox/images/python.ext4 \
            --snapshot-root /mnt/ferrobox/snapshots/python \
            --ready-pool-size 10 \
            --chroot-base /mnt/ferrobox/jailer \
            --runtime-root /mnt/ferrobox/runtime \
            >"${FERROBOX_API_LOG}" 2>&1 &
          api_pid=$!
          cleanup() {
            sudo pkill --signal TERM --parent "${api_pid}" 2>/dev/null || true
            sudo kill "${api_pid}" 2>/dev/null || true
            wait "${api_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 200); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if ! sudo kill -0 "${api_pid}" 2>/dev/null; then
              cat "${FERROBOX_API_LOG}" >&2
              exit 1
            fi
            sleep 0.05
          done
          curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null
          python3 scripts/benchmark-http.py \
            --url http://127.0.0.1:18080 \
            --iterations 5 \
            --concurrency 5 \
            >"${FERROBOX_HTTP_BENCHMARK_OUTPUT}"
          jq --exit-status '
            .schema_version == 4 and
            (.http_create_us | length == 5) and
            (.concurrent_create_us | length == 5) and
            (.http_write_1mib_us | length == 20) and
            (.http_read_1mib_us | length == 20) and
            .http_create_p95_us <= 80000 and
            .concurrent_create_p95_us <= 80000
          ' "${FERROBOX_HTTP_BENCHMARK_OUTPUT}" >/dev/null
          cat "${FERROBOX_HTTP_BENCHMARK_OUTPUT}"

      - name: Compare Docker Engine create and start
        env:
          FERROBOX_HTTP_BENCHMARK_OUTPUT: ${{ runner.temp }}/ferrobox-http-benchmark.json
          FERROBOX_DOCKER_BENCHMARK_OUTPUT: ${{ runner.temp }}/docker-benchmark.json
          FERROBOX_DOCKER_IMAGE: python:3.11-slim-bookworm
        run: |
          set -euo pipefail
          docker pull "${FERROBOX_DOCKER_IMAGE}"
          docker image inspect \
            --format '{{json .RepoDigests}}' \
            "${FERROBOX_DOCKER_IMAGE}" \
            >"${RUNNER_TEMP}/docker-image-digests.json"
          python3 scripts/benchmark-docker.py \
            --image "${FERROBOX_DOCKER_IMAGE}" \
            --iterations 5 \
            --exec-iterations 100 \
            --python-iterations 30 \
            --file-iterations 20 \
            >"${FERROBOX_DOCKER_BENCHMARK_OUTPUT}"
          jq --exit-status --slurp '
            .[0].schema_version == 4 and
            .[1].schema_version == 7 and
            (.[1].docker_create_start_us | length == 5) and
            (.[1].docker_exec_true_us | length == 100) and
            (.[1].docker_exec_python_us | length == 30) and
            (.[1].docker_exec_file_roundtrip_us | length == 20) and
            (.[1].docker_archive_write_1mib_us | length == 20) and
            (.[1].docker_archive_read_1mib_us | length == 20) and
            .[0].http_create_p95_us < .[1].docker_create_start_p95_us
          ' \
            "${FERROBOX_HTTP_BENCHMARK_OUTPUT}" \
            "${FERROBOX_DOCKER_BENCHMARK_OUTPUT}" >/dev/null
          jq --exit-status --slurp '
            .[0].schema_version == 8 and
            .[1].schema_version == 7 and
            .[0].exec_true_p95_us < .[1].docker_exec_true_p95_us and
            .[0].exec_python_p95_us < .[1].docker_exec_python_p95_us
          ' \
            "${RUNNER_TEMP}/ferrobox-benchmark.json" \
            "${FERROBOX_DOCKER_BENCHMARK_OUTPUT}" >/dev/null
          cat "${FERROBOX_DOCKER_BENCHMARK_OUTPUT}"

      - name: Install verified gVisor runtime
        shell: bash
        run: |
          set -euo pipefail
          gvisor_url='https://storage.googleapis.com/gvisor/releases/release/latest/x86_64'
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/gvisor.tar.bz2" \
            "${gvisor_url}/gvisor.tar.bz2"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/gvisor.tar.bz2.sha512" \
            "${gvisor_url}/gvisor.tar.bz2.sha512"
          (
            cd "${RUNNER_TEMP}"
            sha512sum --check gvisor.tar.bz2.sha512
          )
          sudo tar -xjf "${RUNNER_TEMP}/gvisor.tar.bz2" -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          /usr/local/bin/runsc --version | tee "${RUNNER_TEMP}/gvisor-version.txt"
          sha512sum "${RUNNER_TEMP}/gvisor.tar.bz2" \
            >"${RUNNER_TEMP}/gvisor-tarball.sha512"
          docker info --format '{{json .Runtimes}}' |
            jq --exit-status 'has("runsc")' >/dev/null

      - name: Compare gVisor create and start
        env:
          FERROBOX_HTTP_BENCHMARK_OUTPUT: ${{ runner.temp }}/ferrobox-http-benchmark.json
          FERROBOX_RUNTIME_BENCHMARK_OUTPUT: ${{ runner.temp }}/ferrobox-benchmark.json
          FERROBOX_GVISOR_BENCHMARK_OUTPUT: ${{ runner.temp }}/gvisor-benchmark.json
          FERROBOX_DOCKER_IMAGE: python:3.11-slim-bookworm
        run: |
          set -euo pipefail
          python3 scripts/benchmark-docker.py \
            --image "${FERROBOX_DOCKER_IMAGE}" \
            --runtime runsc \
            --iterations 5 \
            --exec-iterations 100 \
            --python-iterations 30 \
            --file-iterations 20 \
            >"${FERROBOX_GVISOR_BENCHMARK_OUTPUT}"
          jq --exit-status --slurp '
            .[0].schema_version == 4 and
            .[1].schema_version == 7 and
            .[1].runtime == "runsc" and
            (.[1].docker_create_start_us | length == 5) and
            (.[1].docker_exec_true_us | length == 100) and
            (.[1].docker_exec_python_us | length == 30) and
            (.[1].docker_exec_file_roundtrip_us | length == 20) and
            (.[1].docker_archive_write_1mib_us | length == 20) and
            (.[1].docker_archive_read_1mib_us | length == 20) and
            .[0].http_create_p95_us < .[1].docker_create_start_p95_us
          ' \
            "${FERROBOX_HTTP_BENCHMARK_OUTPUT}" \
            "${FERROBOX_GVISOR_BENCHMARK_OUTPUT}" >/dev/null
          jq --exit-status --slurp '
            .[0].schema_version == 8 and
            .[1].schema_version == 7 and
            .[0].exec_true_p95_us < .[1].docker_exec_true_p95_us and
            .[0].exec_python_p95_us < .[1].docker_exec_python_p95_us
          ' \
            "${FERROBOX_RUNTIME_BENCHMARK_OUTPUT}" \
            "${FERROBOX_GVISOR_BENCHMARK_OUTPUT}" >/dev/null
          cat "${FERROBOX_GVISOR_BENCHMARK_OUTPUT}"

      - name: Install verified Cloud Hypervisor
        shell: bash
        run: |
          set -euo pipefail
          cloud_hypervisor_url='https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v53.0/cloud-hypervisor-static'
          expected_sha256='448af3d4e59b22c2987f7df94c213ad40fb53a10d437e42b5ee6c4fce7c29ecc'
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/cloud-hypervisor" \
            "${cloud_hypervisor_url}"
          actual_sha256="$(sha256sum "${RUNNER_TEMP}/cloud-hypervisor" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${expected_sha256}" ]]
          sudo install -o root -g root -m 0755 \
            "${RUNNER_TEMP}/cloud-hypervisor" \
            /opt/ferrobox/bin/cloud-hypervisor
          /opt/ferrobox/bin/cloud-hypervisor --version |
            tee "${RUNNER_TEMP}/cloud-hypervisor-version.txt"
          printf '%s  %s\n' "${actual_sha256}" cloud-hypervisor-static \
            >"${RUNNER_TEMP}/cloud-hypervisor.sha256"

      - name: Benchmark Cloud Hypervisor guest boundary
        env:
          FERROBOX_CLOUD_HYPERVISOR: /opt/ferrobox/bin/cloud-hypervisor
          FERROBOX_KERNEL: /mnt/ferrobox/images/vmlinux
          FERROBOX_ROOTFS: /mnt/ferrobox/images/python.ext4
          FERROBOX_MICROVM_PROBE: target/debug/microvm-probe
          FERROBOX_CLOUD_HYPERVISOR_OUTPUT: ${{ runner.temp }}/cloud-hypervisor-benchmark.json
          FERROBOX_CLOUD_HYPERVISOR_RUNTIME_ROOT: /mnt/ferrobox/runtime/cloud-hypervisor
        run: |
          sudo --preserve-env=FERROBOX_CLOUD_HYPERVISOR,FERROBOX_KERNEL,FERROBOX_ROOTFS,FERROBOX_MICROVM_PROBE,FERROBOX_CLOUD_HYPERVISOR_OUTPUT,FERROBOX_CLOUD_HYPERVISOR_RUNTIME_ROOT \
            bash scripts/benchmark-cloud-hypervisor.sh

      - name: Cache Kata Containers release bundle
        id: kata-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kata-static-3.31.0-amd64.tar.zst
          key: kata-static-3.31.0-amd64-68c2786a

      - name: Install verified Kata Containers
        shell: bash
        run: |
          set -euo pipefail
          kata_archive="${RUNNER_TEMP}/kata-static-3.31.0-amd64.tar.zst"
          kata_url='https://github.com/kata-containers/kata-containers/releases/download/3.31.0/kata-static-3.31.0-amd64.tar.zst'
          expected_sha256='68c2786a0b97023f62f3eca02dc868b78a794e5469d4ddd6cc9e0bd4a7212b0b'
          if [[ ! -f "${kata_archive}" ]]; then
            curl --fail --location --silent --show-error \
              --output "${kata_archive}" \
              "${kata_url}"
          fi
          actual_sha256="$(sha256sum "${kata_archive}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${expected_sha256}" ]]
          sudo tar --extract --use-compress-program=unzstd \
            --file "${kata_archive}" \
            --directory /
          sudo ln --symbolic --force \
            /opt/kata/bin/containerd-shim-kata-v2 \
            /usr/local/bin/containerd-shim-kata-v2
          /opt/kata/bin/kata-runtime --version |
            tee "${RUNNER_TEMP}/kata-version.txt"
          sudo /opt/kata/bin/kata-runtime check --no-network-checks
          printf '%s  %s\n' "${actual_sha256}" \
            kata-static-3.31.0-amd64.tar.zst \
            >"${RUNNER_TEMP}/kata-static.sha256"

      - name: Save Kata Containers release bundle
        if: steps.kata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kata-static-3.31.0-amd64.tar.zst
          key: ${{ steps.kata-cache.outputs.cache-primary-key }}

      - name: Benchmark Kata Containers QEMU boundary
        env:
          FERROBOX_CTR: /usr/bin/ctr
          FERROBOX_CONTAINERD: /usr/bin/containerd
          FERROBOX_KATA_OUTPUT: ${{ runner.temp }}/kata-benchmark.json
          FERROBOX_KATA_RUNTIME_ROOT: /mnt/ferrobox/runtime/kata
          FERROBOX_KATA_IMAGE: docker.io/library/python:3.11-slim-bookworm
        run: |
          sudo --preserve-env=FERROBOX_CTR,FERROBOX_CONTAINERD,FERROBOX_KATA_OUTPUT,FERROBOX_KATA_RUNTIME_ROOT,FERROBOX_KATA_IMAGE \
            bash scripts/benchmark-kata.sh

      - name: Validate microVM performance leadership
        run: |
          jq --exit-status --slurp '
            .[0].schema_version == 8 and
            .[1].schema_version == 4 and
            .[2].schema_version == 1 and
            .[3].schema_version == 1 and
            (.[2].exec_true_us | length == 100) and
            (.[2].exec_python_us | length == 30) and
            (.[3].exec_true_us | length == 100) and
            (.[3].exec_python_us | length == 30) and
            .[0].pool_prepare_p95_us < .[2].ready_p95_us and
            .[1].http_create_p95_us < .[2].ready_p95_us and
            .[0].exec_true_p50_us < .[2].exec_true_p50_us and
            .[0].pool_prepare_p95_us + .[0].exec_true_p95_us < .[3].cold_job_p95_us and
            .[1].http_create_p95_us + .[0].exec_true_p95_us < .[3].cold_job_p95_us and
            .[0].exec_true_p50_us < .[3].exec_true_p50_us and
            .[0].exec_true_p95_us < .[3].exec_true_p95_us and
            .[0].exec_python_p50_us < .[3].exec_python_p50_us and
            .[0].exec_python_p95_us < .[3].exec_python_p95_us
          ' \
            "${RUNNER_TEMP}/ferrobox-benchmark.json" \
            "${RUNNER_TEMP}/ferrobox-http-benchmark.json" \
            "${RUNNER_TEMP}/cloud-hypervisor-benchmark.json" \
            "${RUNNER_TEMP}/kata-benchmark.json" >/dev/null

      - name: Validate file-workload performance leadership
        run: |
          jq --exit-status --slurp '
            .[0].schema_version == 8 and
            .[1].schema_version == 7 and
            .[2].schema_version == 7 and
            .[0].exec_file_roundtrip_p95_us < .[1].docker_exec_file_roundtrip_p95_us and
            .[0].exec_file_roundtrip_p95_us < .[2].docker_exec_file_roundtrip_p95_us
          ' \
            "${RUNNER_TEMP}/ferrobox-benchmark.json" \
            "${RUNNER_TEMP}/docker-benchmark.json" \
            "${RUNNER_TEMP}/gvisor-benchmark.json" >/dev/null

      - name: Validate file-API performance leadership
        run: |
          jq --exit-status --slurp '
            .[0].schema_version == 4 and
            .[1].schema_version == 7 and
            .[2].schema_version == 7 and
            .[0].http_write_1mib_p95_us < .[1].docker_archive_write_1mib_p95_us and
            .[0].http_write_1mib_p95_us < .[2].docker_archive_write_1mib_p95_us and
            .[0].http_read_1mib_p95_us < .[1].docker_archive_read_1mib_p95_us and
            .[0].http_read_1mib_p95_us < .[2].docker_archive_read_1mib_p95_us
          ' \
            "${RUNNER_TEMP}/ferrobox-http-benchmark.json" \
            "${RUNNER_TEMP}/docker-benchmark.json" \
            "${RUNNER_TEMP}/gvisor-benchmark.json" >/dev/null

      - name: Run Firecracker internet-policy end-to-end
        env:
          FERROBOX_FIRECRACKER: /opt/ferrobox/bin/firecracker
          FERROBOX_JAILER: /opt/ferrobox/bin/jailer
          FERROBOX_KERNEL: /opt/ferrobox/images/vmlinux
          FERROBOX_ROOTFS: /opt/ferrobox/images/python.ext4
          FERROBOX_NODE_BINARY: target/debug/ferrobox-node
          FERROBOX_INTERNET: "1"
        run: sudo --preserve-env=FERROBOX_FIRECRACKER,FERROBOX_JAILER,FERROBOX_KERNEL,FERROBOX_ROOTFS,FERROBOX_NODE_BINARY,FERROBOX_INTERNET bash scripts/e2e-kvm.sh

      - name: Upload provenance and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvm-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kernel.manifest
            ${{ runner.temp }}/ferrobox-benchmark.json
            ${{ runner.temp }}/ferrobox-http-benchmark.json
            ${{ runner.temp }}/docker-benchmark.json
            ${{ runner.temp }}/docker-image-digests.json
            ${{ runner.temp }}/gvisor-benchmark.json
            ${{ runner.temp }}/gvisor-version.txt
            ${{ runner.temp }}/gvisor-tarball.sha512
            ${{ runner.temp }}/cloud-hypervisor-benchmark.json
            ${{ runner.temp }}/cloud-hypervisor-version.txt
            ${{ runner.temp }}/cloud-hypervisor.sha256
            ${{ runner.temp }}/kata-benchmark.json
            ${{ runner.temp }}/kata-version.txt
            ${{ runner.temp }}/kata-static.sha256
            ${{ runner.temp }}/ferrobox-api.log
            /mnt/ferrobox/runtime/kata/containerd.log
            /opt/ferrobox/images/python.ext4.manifest.json
            /mnt/ferrobox/jailer/**/root/*.log
            /srv/ferrobox/jailer/**/root/*.log

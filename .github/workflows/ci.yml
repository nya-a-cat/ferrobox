name: Ferrobox CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03
        with:
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify GitHub Action commit pins
        run: bash scripts/check-action-pins.sh

      - name: Generate dependency lock
        run: cargo generate-lockfile

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Unit and integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace build
        run: cargo build --workspace --locked

      - name: Static guest build
        run: cargo build -p ferrobox-guest --release --target x86_64-unknown-linux-musl --locked

      - name: Process/API end-to-end
        run: bash scripts/e2e-process.sh

      - name: Validate Agent Skill
        run: bash scripts/check-agent-skill.sh

      - name: CLI and Agent Skill end-to-end
        run: bash scripts/e2e-cli.sh

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false

      - name: Fetch verified OpenAPI Generator
        run: |
          java -version
          bash scripts/fetch-openapi-generator.sh \
            "${RUNNER_TEMP}/openapi-generator"

      - name: Validate OpenAPI and generate deterministic SDK sources
        run: |
          generator="${RUNNER_TEMP}/openapi-generator/openapi-generator-cli-7.22.0.jar"
          java -jar "${generator}" validate \
            --input-spec openapi/ferrobox-v1.json
          bash scripts/generate-openapi-clients.sh \
            "${generator}" \
            openapi/ferrobox-v1.json \
            "${RUNNER_TEMP}/generated-openapi-clients"
          bash scripts/generate-openapi-clients.sh \
            "${generator}" \
            openapi/ferrobox-v1.json \
            "${RUNNER_TEMP}/generated-openapi-clients-replay"
          diff --recursive --brief \
            "${RUNNER_TEMP}/generated-openapi-clients" \
            "${RUNNER_TEMP}/generated-openapi-clients-replay"

      - name: Generated Python SDK end-to-end
        env:
          FERROBOX_API_URL: http://127.0.0.1:18083
          FERROBOX_OPENAPI_PYTHON_EVIDENCE: ${{ runner.temp }}/openapi-python-e2e.json
        run: |
          bash scripts/e2e-openapi-python.sh \
            "${RUNNER_TEMP}/generated-openapi-clients/python"

      - name: Record OpenAPI contract evidence
        run: |
          uv run --no-project --python 3.12 python scripts/check-openapi.py \
            openapi/ferrobox-v1.json \
            --router-source crates/ferrobox-api/src/lib.rs \
            --generated-root "${RUNNER_TEMP}/generated-openapi-clients" \
            --output "${RUNNER_TEMP}/openapi-contract-evidence.json"

      - name: Upload OpenAPI contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-contract-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/openapi-generator/openapi-generator.manifest
            ${{ runner.temp }}/openapi-contract-evidence.json
            ${{ runner.temp }}/openapi-python-e2e.json
            ${{ runner.temp }}/generated-openapi-clients

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cargo.lock
          path: Cargo.lock

  firecracker-gate:
    name: Firecracker host gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect KVM
        id: kvm
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          if [[ ! -c /dev/kvm ]]; then
            echo "available=false" >>"${GITHUB_OUTPUT}"
            echo "::error::This runner does not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 660 /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "available=true" >>"${GITHUB_OUTPUT}"

      - name: Fetch pinned Firecracker and Jailer
        run: bash scripts/fetch-firecracker.sh "${RUNNER_TEMP}/firecracker"

      - name: Verify versions
        run: |
          test "$("${RUNNER_TEMP}/firecracker/firecracker" --version | grep -c '1.15.1')" -eq 1
          test "$("${RUNNER_TEMP}/firecracker/jailer" --version | grep -c '1.15.1')" -eq 1

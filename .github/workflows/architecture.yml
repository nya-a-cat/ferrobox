name: Ferrobox Host Architecture Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: Native ${{ matrix.platform_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: linux-x86_64
            runner: ubuntu-24.04
            runner_arch: X64
            machine: x86_64
            rust_host: x86_64-unknown-linux-gnu
            static_guest_target: x86_64-unknown-linux-musl
          - platform_id: linux-aarch64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            machine: aarch64
            rust_host: aarch64-unknown-linux-gnu
            static_guest_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        id: rust_toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03
        with:
          targets: ${{ matrix.static_guest_target }}

      - name: Install native build tools
        id: native_build_tools
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq musl-tools protobuf-compiler

      - name: Cache Rust build state
        continue-on-error: true
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: architecture-${{ matrix.platform_id }}

      - name: Verify GitHub Action commit pins
        id: action_pin_policy
        continue-on-error: true
        run: bash scripts/check-action-pins.sh

      - name: Generate dependency lock
        id: dependency_lock
        continue-on-error: true
        run: cargo generate-lockfile

      - name: Workspace tests
        id: workspace_tests
        continue-on-error: true
        run: cargo test --workspace --all-targets --locked

      - name: Workspace build
        id: workspace_build
        continue-on-error: true
        run: cargo build --workspace --locked

      - name: Static native guest build
        id: static_guest_build
        continue-on-error: true
        run: >-
          cargo build -p ferrobox-guest --release
          --target ${{ matrix.static_guest_target }} --locked

      - name: Process/API lifecycle smoke
        id: process_api_lifecycle
        continue-on-error: true
        run: bash scripts/e2e-process.sh

      - name: CLI lifecycle smoke
        id: cli_lifecycle
        continue-on-error: true
        run: bash scripts/e2e-cli.sh

      - name: Record and enforce native host capability
        if: always()
        run: |
          python3 scripts/record-host-capability.py \
            --platform-id '${{ matrix.platform_id }}' \
            --runner-label '${{ matrix.runner }}' \
            --expected-runner-arch '${{ matrix.runner_arch }}' \
            --expected-machine '${{ matrix.machine }}' \
            --expected-rust-host '${{ matrix.rust_host }}' \
            --static-guest-target '${{ matrix.static_guest_target }}' \
            --static-guest 'target/${{ matrix.static_guest_target }}/release/ferrobox-guest' \
            --check 'rust-toolchain=${{ steps.rust_toolchain.outcome }}' \
            --check 'native-build-tools=${{ steps.native_build_tools.outcome }}' \
            --check 'action-pin-policy=${{ steps.action_pin_policy.outcome }}' \
            --check 'dependency-lock=${{ steps.dependency_lock.outcome }}' \
            --check 'workspace-tests=${{ steps.workspace_tests.outcome }}' \
            --check 'workspace-build=${{ steps.workspace_build.outcome }}' \
            --check 'static-guest-build=${{ steps.static_guest_build.outcome }}' \
            --check 'process-api-lifecycle=${{ steps.process_api_lifecycle.outcome }}' \
            --check 'cli-lifecycle=${{ steps.cli_lifecycle.outcome }}' \
            --output '${{ runner.temp }}/host-capability-${{ matrix.platform_id }}/host-capability.json'

      - name: Upload native host capability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-capability-${{ matrix.platform_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/host-capability-${{ matrix.platform_id }}/host-capability.json

  darwin-diagnostic:
    name: Native macos-aarch64 diagnostic
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        id: rust_toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      - name: Verify native tools
        id: native_tools
        continue-on-error: true
        shell: bash
        run: |
          command -v bash
          command -v curl
          command -v jq
          command -v python3

      - name: Verify GitHub Action commit pins
        id: action_pin_policy
        continue-on-error: true
        shell: bash
        run: bash scripts/check-action-pins.sh

      - name: Generate dependency lock
        id: dependency_lock
        continue-on-error: true
        shell: bash
        run: cargo generate-lockfile

      - name: Test host-side crates
        id: host_tests
        continue-on-error: true
        shell: bash
        run: >-
          cargo test --locked --all-targets
          -p ferrobox-core
          -p ferrobox-protocol
          -p ferrobox-node
          -p ferrobox-api
          -p ferrobox-cli

      - name: Build host-side binaries
        id: host_build
        continue-on-error: true
        shell: bash
        run: cargo build --locked -p ferrobox-api -p ferrobox-cli

      - name: Process/API lifecycle smoke
        id: process_api_lifecycle
        continue-on-error: true
        shell: bash
        run: bash scripts/e2e-process.sh

      - name: CLI lifecycle smoke
        id: cli_lifecycle
        continue-on-error: true
        shell: bash
        run: bash scripts/e2e-cli.sh

      - name: Record macOS diagnostic
        if: always()
        shell: bash
        run: |
          diagnostic="${RUNNER_TEMP}/macos-aarch64-diagnostic.txt"
          {
            printf 'repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
            printf 'runner_os=%s\n' "${RUNNER_OS}"
            printf 'image_os=%s\n' "${ImageOS:-}"
            printf 'image_version=%s\n' "${ImageVersion:-}"
            printf 'rust_toolchain=%s\n' '${{ steps.rust_toolchain.outcome }}'
            printf 'native_tools=%s\n' '${{ steps.native_tools.outcome }}'
            printf 'action_pin_policy=%s\n' '${{ steps.action_pin_policy.outcome }}'
            printf 'dependency_lock=%s\n' '${{ steps.dependency_lock.outcome }}'
            printf 'host_tests=%s\n' '${{ steps.host_tests.outcome }}'
            printf 'host_build=%s\n' '${{ steps.host_build.outcome }}'
            printf 'process_api_lifecycle=%s\n' '${{ steps.process_api_lifecycle.outcome }}'
            printf 'cli_lifecycle=%s\n' '${{ steps.cli_lifecycle.outcome }}'
            uname -a
            sysctl -n machdep.cpu.brand_string || true
            rustc -vV || true
          } >"${diagnostic}"
          cat "${diagnostic}"

      - name: Upload macOS diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-capability-macos-aarch64-diagnostic
          if-no-files-found: error
          path: ${{ runner.temp }}/macos-aarch64-diagnostic.txt

      - name: Enforce macOS diagnostic
        if: always()
        shell: bash
        run: |
          test '${{ steps.rust_toolchain.outcome }}' = success
          test '${{ steps.native_tools.outcome }}' = success
          test '${{ steps.action_pin_policy.outcome }}' = success
          test '${{ steps.dependency_lock.outcome }}' = success
          test '${{ steps.host_tests.outcome }}' = success
          test '${{ steps.host_build.outcome }}' = success
          test '${{ steps.process_api_lifecycle.outcome }}' = success
          test '${{ steps.cli_lifecycle.outcome }}' = success

  convergence:
    name: Host architecture convergence
    if: always()
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GitHub Action commit pins
        run: bash scripts/check-action-pins.sh

      - name: Download native host capabilities
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: host-capability-*
          path: ${{ runner.temp }}/host-capabilities

      - name: Converge the architecture matrix
        run: |
          python3 scripts/check-host-capability-matrix.py \
            --evidence-root '${{ runner.temp }}/host-capabilities' \
            --output '${{ runner.temp }}/host-capability-matrix/host-capability-matrix.json'

      - name: Upload architecture matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-capability-matrix
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/host-capabilities
            ${{ runner.temp }}/host-capability-matrix

name: Ferrobox Host Architecture Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: Native ${{ matrix.platform_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: linux-x86_64
            runner: ubuntu-24.04
            runner_arch: X64
            machine: x86_64
            rust_host: x86_64-unknown-linux-gnu
            static_guest_target: x86_64-unknown-linux-musl
          - platform_id: linux-aarch64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            machine: aarch64
            rust_host: aarch64-unknown-linux-gnu
            static_guest_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        id: rust_toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03
        with:
          targets: ${{ matrix.static_guest_target }}

      - name: Install native build tools
        id: native_build_tools
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq musl-tools protobuf-compiler

      - name: Cache Rust build state
        continue-on-error: true
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: architecture-${{ matrix.platform_id }}

      - name: Verify GitHub Action commit pins
        id: action_pin_policy
        continue-on-error: true
        run: bash scripts/check-action-pins.sh

      - name: Generate dependency lock
        id: dependency_lock
        continue-on-error: true
        run: cargo generate-lockfile

      - name: Workspace tests
        id: workspace_tests
        continue-on-error: true
        run: cargo test --workspace --all-targets --locked

      - name: Workspace build
        id: workspace_build
        continue-on-error: true
        run: cargo build --workspace --locked

      - name: Static native guest build
        id: static_guest_build
        continue-on-error: true
        run: >-
          cargo build -p ferrobox-guest --release
          --target ${{ matrix.static_guest_target }} --locked

      - name: Process/API lifecycle smoke
        id: process_api_lifecycle
        continue-on-error: true
        run: bash scripts/e2e-process.sh

      - name: CLI lifecycle smoke
        id: cli_lifecycle
        continue-on-error: true
        run: bash scripts/e2e-cli.sh

      - name: Record and enforce native host capability
        if: always()
        run: |
          python3 scripts/record-host-capability.py \
            --platform-id '${{ matrix.platform_id }}' \
            --runner-label '${{ matrix.runner }}' \
            --expected-runner-arch '${{ matrix.runner_arch }}' \
            --expected-runner-os 'Linux' \
            --expected-kernel 'Linux' \
            --expected-machine '${{ matrix.machine }}' \
            --expected-rust-host '${{ matrix.rust_host }}' \
            --static-guest-target '${{ matrix.static_guest_target }}' \
            --static-guest 'target/${{ matrix.static_guest_target }}/release/ferrobox-guest' \
            --check 'rust-toolchain=${{ steps.rust_toolchain.outcome }}' \
            --check 'native-build-tools=${{ steps.native_build_tools.outcome }}' \
            --check 'action-pin-policy=${{ steps.action_pin_policy.outcome }}' \
            --check 'dependency-lock=${{ steps.dependency_lock.outcome }}' \
            --check 'workspace-tests=${{ steps.workspace_tests.outcome }}' \
            --check 'workspace-build=${{ steps.workspace_build.outcome }}' \
            --check 'static-guest-build=${{ steps.static_guest_build.outcome }}' \
            --check 'process-api-lifecycle=${{ steps.process_api_lifecycle.outcome }}' \
            --check 'cli-lifecycle=${{ steps.cli_lifecycle.outcome }}' \
            --output '${{ runner.temp }}/host-capability-${{ matrix.platform_id }}/host-capability.json'

      - name: Upload native host capability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-capability-${{ matrix.platform_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/host-capability-${{ matrix.platform_id }}/host-capability.json

  darwin:
    name: Native macos-aarch64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        id: rust_toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      - name: Verify native tools
        id: native_tools
        continue-on-error: true
        shell: bash
        run: |
          command -v bash
          command -v curl
          command -v jq
          command -v python3

      - name: Verify GitHub Action commit pins
        id: action_pin_policy
        continue-on-error: true
        shell: bash
        run: bash scripts/check-action-pins.sh

      - name: Generate dependency lock
        id: dependency_lock
        continue-on-error: true
        shell: bash
        run: cargo generate-lockfile

      - name: Test host-side crates
        id: host_tests
        continue-on-error: true
        shell: bash
        run: >-
          cargo test --locked --all-targets
          -p ferrobox-core
          -p ferrobox-protocol
          -p ferrobox-node
          -p ferrobox-api
          -p ferrobox-cli

      - name: Build host-side binaries
        id: host_build
        continue-on-error: true
        shell: bash
        run: cargo build --locked -p ferrobox-api -p ferrobox-cli

      - name: Process/API lifecycle smoke
        id: process_api_lifecycle
        continue-on-error: true
        shell: bash
        run: bash scripts/e2e-process.sh

      - name: CLI lifecycle smoke
        id: cli_lifecycle
        continue-on-error: true
        shell: bash
        run: bash scripts/e2e-cli.sh

      - name: Record and enforce native host capability
        if: always()
        shell: bash
        run: |
          python3 scripts/record-host-capability.py \
            --platform-id 'macos-aarch64' \
            --runner-label 'macos-15' \
            --expected-runner-arch 'ARM64' \
            --expected-runner-os 'macOS' \
            --expected-kernel 'Darwin' \
            --expected-machine 'arm64' \
            --expected-rust-host 'aarch64-apple-darwin' \
            --check 'rust-toolchain=${{ steps.rust_toolchain.outcome }}' \
            --check 'native-tools=${{ steps.native_tools.outcome }}' \
            --check 'action-pin-policy=${{ steps.action_pin_policy.outcome }}' \
            --check 'dependency-lock=${{ steps.dependency_lock.outcome }}' \
            --check 'host-tests=${{ steps.host_tests.outcome }}' \
            --check 'host-build=${{ steps.host_build.outcome }}' \
            --check 'process-api-lifecycle=${{ steps.process_api_lifecycle.outcome }}' \
            --check 'cli-lifecycle=${{ steps.cli_lifecycle.outcome }}' \
            --output '${{ runner.temp }}/host-capability-macos-aarch64/host-capability.json'

      - name: Upload native host capability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-capability-macos-aarch64
          if-no-files-found: error
          path: ${{ runner.temp }}/host-capability-macos-aarch64/host-capability.json

  windows-diagnostic:
    name: Native windows-aarch64 diagnostic
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      FERROBOX_TEST_PYTHON: python
      MSYS2_ARG_CONV_EXCL: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        id: rust_toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      - name: Verify native tools
        id: native_tools
        continue-on-error: true
        shell: pwsh
        run: Get-Command bash, cargo, jq, python, rustc

      - name: Verify GitHub Action commit pins
        id: action_pin_policy
        continue-on-error: true
        shell: bash
        run: bash scripts/check-action-pins.sh

      - name: Generate dependency lock
        id: dependency_lock
        continue-on-error: true
        shell: pwsh
        run: cargo generate-lockfile

      - name: Test host-side crates
        id: host_tests
        continue-on-error: true
        shell: pwsh
        run: >-
          cargo test --locked --all-targets
          -p ferrobox-core
          -p ferrobox-protocol
          -p ferrobox-node
          -p ferrobox-api
          -p ferrobox-cli

      - name: Build host-side binaries
        id: host_build
        continue-on-error: true
        shell: pwsh
        run: cargo build --locked -p ferrobox-api -p ferrobox-cli

      - name: Process/API lifecycle smoke
        id: process_api_lifecycle
        continue-on-error: true
        shell: bash
        run: bash scripts/e2e-process.sh

      - name: CLI lifecycle smoke
        id: cli_lifecycle
        continue-on-error: true
        shell: bash
        run: bash scripts/e2e-cli.sh

      - name: Record Windows ARM diagnostic
        if: always()
        shell: pwsh
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP 'windows-aarch64-diagnostic.txt'
          @(
            "repository=$env:GITHUB_REPOSITORY"
            "commit=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_os=$env:RUNNER_OS"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "os_description=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "os_architecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
            "rust_toolchain=${{ steps.rust_toolchain.outcome }}"
            "native_tools=${{ steps.native_tools.outcome }}"
            "action_pin_policy=${{ steps.action_pin_policy.outcome }}"
            "dependency_lock=${{ steps.dependency_lock.outcome }}"
            "host_tests=${{ steps.host_tests.outcome }}"
            "host_build=${{ steps.host_build.outcome }}"
            "process_api_lifecycle=${{ steps.process_api_lifecycle.outcome }}"
            "cli_lifecycle=${{ steps.cli_lifecycle.outcome }}"
          ) | Set-Content -LiteralPath $diagnostic -Encoding utf8NoBOM
          rustc -vV | Add-Content -LiteralPath $diagnostic -Encoding utf8
          Get-Content -LiteralPath $diagnostic

      - name: Upload Windows ARM diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-capability-windows-aarch64-diagnostic
          if-no-files-found: error
          path: ${{ runner.temp }}/windows-aarch64-diagnostic.txt

      - name: Enforce Windows ARM diagnostic
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.rust_toolchain.outcome }}'
            '${{ steps.native_tools.outcome }}'
            '${{ steps.action_pin_policy.outcome }}'
            '${{ steps.dependency_lock.outcome }}'
            '${{ steps.host_tests.outcome }}'
            '${{ steps.host_build.outcome }}'
            '${{ steps.process_api_lifecycle.outcome }}'
            '${{ steps.cli_lifecycle.outcome }}'
          )
          $failures = @($outcomes | Where-Object { $_ -ne 'success' })
          if ($failures.Count -gt 0) {
            throw "Windows ARM diagnostic contains $($failures.Count) failed outcomes"
          }

  convergence:
    name: Host architecture convergence
    if: always()
    needs: [native, darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GitHub Action commit pins
        run: bash scripts/check-action-pins.sh

      - name: Download native host capabilities
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: host-capability-*
          path: ${{ runner.temp }}/host-capabilities

      - name: Converge the architecture matrix
        run: |
          python3 scripts/check-host-capability-matrix.py \
            --evidence-root '${{ runner.temp }}/host-capabilities' \
            --output '${{ runner.temp }}/host-capability-matrix/host-capability-matrix.json'

      - name: Upload architecture matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-capability-matrix
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/host-capabilities
            ${{ runner.temp }}/host-capability-matrix

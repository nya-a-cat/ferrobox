import org.gradle.api.artifacts.dsl.LockMode
import org.gradle.api.tasks.JavaExec

allprojects {
    afterEvaluate { project ->
        project.dependencyLocking {
            lockAllConfigurations()
            lockMode = LockMode.STRICT
        }
        project.tasks.register("ferroboxSdkPrefetch") {
            group = "verification"
            description = "Resolve every generated Kotlin SDK dependency configuration"
            doLast {
                project.configurations.findAll { it.canBeResolved }.each { configuration ->
                    configuration.files.each { dependency ->
                        if (!dependency.exists()) {
                            throw new GradleException(
                                "Missing ${configuration.name} dependency: ${dependency}"
                            )
                        }
                    }
                }
            }
        }
        project.tasks.register("ferroboxSdkE2E", JavaExec) {
            group = "verification"
            description = "Run the generated Ferrobox Kotlin SDK against the shared API"
            classpath = project.sourceSets.main.runtimeClasspath
            mainClass = "FerroboxSdkE2EKt"
        }
    }
}
